<main class="mx-auto max-w-[1100px] px-5 pb-[60px]">
  <app-product-selector />
  <app-flight-search-form
    [airports]="airports"
    [cabinClasses]="cabinClasses"
    [isLoading]="isLoading()"
    (searched)="onSearch($event)"
  />
  @if (errorMessage()) {
    <div
      class="mt-3 rounded-xl border border-[rgba(255,77,79,0.55)] bg-[rgba(255,77,79,0.12)] p-3 font-semibold text-[rgba(255,214,214,0.95)]"
      role="alert"
    >
      {{ errorMessage() }}
    </div>
  }
  @if (showResultsTable()) {
    <app-flight-results-table
      [results]="searchResults()"
      [selectedFlight]="selectedFlight()"
      (flightSelected)="onFlightSelected($event)"
    />
  }
  @if (showEmptyState()) {
    <app-flight-empty-state />
  }
  @if (selectedFlight()) {
    <app-booking-panel
      [flight]="selectedFlight()!"
      [passengers]="passengers()"
    />
  }
</main>
